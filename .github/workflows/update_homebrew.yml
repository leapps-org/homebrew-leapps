name: Update Homebrew Formulae and Casks

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-formulae:
    # macOS: the updater mounts each disk image to check what is inside it
    # before it writes a cask.
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Tools
        id: process
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          bash scripts/update_homebrew.sh || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # 3 means every tool was processed and at least one could not be
          # updated: what did update is committed, and the last step fails the run.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add Formula/*.rb Casks/*.rb tools.json README.md Install.md Maintenance.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update Homebrew formulae and casks for latest versions"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Fail when a tool could not be updated
        if: steps.process.outputs.status == '3'
        run: |
          echo "At least one tool could not be updated. See the ERROR lines of the Process Tools step."
          exit 1
