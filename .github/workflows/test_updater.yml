name: Test Updater

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run the updater tests
        run: bash tests/test_update_homebrew.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check cask configuration and migrations
        run: node --test
